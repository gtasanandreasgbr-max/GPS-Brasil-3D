<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102536">
  <meta name="description" content="GPS Brasil - mapa de ruas 2D e localização para caminhadas.">
  <title>GPS Brasil - Mapa de Ruas</title>

  <!-- Leaflet: biblioteca para exibir o mapa 2D -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Configuração para instalação como aplicativo -->
  <link rel="manifest" href="./manifest.json">

  <style>
    /* Configuração básica da página */
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: #eef2f4;
      color: #172b3a;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* O mapa ocupa toda a tela e fica sempre visto de cima */
    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #e8edf0;
    }

    /* Cabeçalho do aplicativo */
    .topbar {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 15px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 3px 15px rgba(20,40,55,.18);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      color: #fff;
      background: #0879d1;
      font-size: 23px;
    }
    .brand strong { display: block; font-size: 14px; letter-spacing: .3px; }
    .brand small { display: block; margin-top: 3px; color: #647987; font-size: 10px; }
    #status {
      max-width: 45%;
      color: #526977;
      font-size: 11px;
      line-height: 1.35;
      text-align: right;
    }

    /* Cartão inferior com as coordenadas */
    .bottom-panel {
      position: absolute;
      z-index: 1000;
      left: 12px;
      right: 12px;
      bottom: 14px;
      padding: 14px;
      border-radius: 17px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 3px 18px rgba(20,40,55,.2);
    }
    .panel-label {
      margin-bottom: 6px;
      color: #718492;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: .7px;
    }
    #coordinates { min-height: 19px; color: #172b3a; font-size: 14px; font-weight: bold; }
    #accuracy { margin-top: 5px; color: #667c89; font-size: 11px; }
    .buttons { display: flex; gap: 9px; margin-top: 13px; }
    button {
      min-height: 45px;
      border: 0;
      border-radius: 11px;
      padding: 0 14px;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    #startButton { flex: 1; background: #0879d1; }
    #stopButton { background: #526977; }
    button:disabled { opacity: .5; cursor: default; }

    /* Ponto azul de localização, no estilo de aplicativos de mapas */
    .gps-dot-wrap {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
    }
    .gps-dot {
      width: 19px;
      height: 19px;
      border: 4px solid #fff;
      border-radius: 50%;
      background: #1688f8;
      box-shadow: 0 1px 7px rgba(0,0,0,.45), 0 0 0 8px rgba(22,136,248,.18);
    }

    /* Ajustes dos controles do mapa */
    .leaflet-control-zoom a {
      color: #18384d !important;
      border-radius: 7px !important;
    }
    .leaflet-control-attribution {
      font-size: 9px !important;
    }

    /* Adaptação para celulares */
    @media (max-width: 480px) {
      .topbar { top: 9px; left: 9px; right: 9px; padding: 10px; }
      .bottom-panel { left: 9px; right: 9px; bottom: 9px; }
      #status { max-width: 40%; }
    }
  </style>
</head>
<body>
  <!-- Mapa 2D de ruas -->
  <div id="map"></div>

  <!-- Cabeçalho -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">⌖</div>
      <div>
        <strong>GPS BRASIL</strong>
        <small>MAPA DE RUAS • MODO CAMINHADA</small>
      </div>
    </div>
    <div id="status">Mapa pronto • aguardando GPS</div>
  </header>

  <!-- Informações e comandos do GPS -->
  <section class="bottom-panel">
    <div class="panel-label">MINHA LOCALIZAÇÃO</div>
    <div id="coordinates">Toque em “Iniciar localização”</div>
    <div id="accuracy">O ponto azul mostrará sua posição no mapa.</div>
    <div class="buttons">
      <button id="startButton">● Iniciar localização</button>
      <button id="stopButton" disabled>Parar</button>
    </div>
  </section>

  <!-- Leaflet é carregado pela internet nesta primeira versão -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Elementos da tela
    const statusText = document.getElementById("status");
    const coordinatesText = document.getElementById("coordinates");
    const accuracyText = document.getElementById("accuracy");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");

    // Centro inicial aproximado do Brasil
    const brasilCenter = [-14.2, -51.9];

    // Cria o mapa plano, sem inclinação ou visualização 3D
    const map = L.map("map", {
      zoomControl: false,
      attributionControl: true
    }).setView(brasilCenter, 4);

    // Camada de ruas com nomes de vias, bairros e cidades
    // Os mapas são fornecidos online pelo OpenStreetMap
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // Controles para aproximar, afastar e localizar o norte
    L.control.zoom({ position: "topright" }).addTo(map);

    // Ícone azul que representa a posição atual do usuário
    const gpsIcon = L.divIcon({
      className: "",
      html: '<div class="gps-dot-wrap"><div class="gps-dot"></div></div>',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    // Marcador e círculo de precisão serão criados após receber o GPS
    let userMarker = null;
    let accuracyCircle = null;
    let watchId = null;

    // Recebe cada atualização da posição do aparelho
    function updatePosition(position) {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = Math.round(position.coords.accuracy);
      const userPosition = [latitude, longitude];

      // Atualiza as coordenadas na tela
      coordinatesText.textContent =
        latitude.toFixed(6) + ", " + longitude.toFixed(6);
      accuracyText.textContent =
        "Precisão aproximada: " + accuracy + " metros";
      statusText.textContent = "GPS ativo • acompanhando sua caminhada";

      // Cria ou movimenta o ponto azul
      if (userMarker === null) {
        userMarker = L.marker(userPosition, {
          icon: gpsIcon,
          title: "Minha localização"
        }).addTo(map);
      } else {
        userMarker.setLatLng(userPosition);
      }

      // Desenha o círculo que representa a margem de precisão do GPS
      if (accuracyCircle === null) {
        accuracyCircle = L.circle(userPosition, {
          radius: accuracy,
          color: "#1688f8",
          weight: 1,
          fillColor: "#1688f8",
          fillOpacity: 0.12
        }).addTo(map);
      } else {
        accuracyCircle.setLatLng(userPosition);
        accuracyCircle.setRadius(accuracy);
      }

      // Mantém o mapa centralizado no usuário durante a caminhada
      map.setView(userPosition, Math.max(map.getZoom(), 17), {
        animate: true
      });
    }

    // Mostra erros de permissão ou sinal do GPS
    function showPositionError(error) {
      if (error.code === 1) {
        statusText.textContent = "Permita o acesso à localização";
      } else if (error.code === 2) {
        statusText.textContent = "Sinal de localização indisponível";
      } else if (error.code === 3) {
        statusText.textContent = "GPS demorou para responder";
      } else {
        statusText.textContent = "Não foi possível obter o GPS";
      }
    }

    // Inicia o acompanhamento contínuo da localização
    function startTracking() {
      if (!navigator.geolocation) {
        statusText.textContent = "Este navegador não oferece GPS";
        return;
      }

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
      }

      statusText.textContent = "Procurando sua localização...";
      coordinatesText.textContent = "Aguardando sinal do GPS...";
      startButton.disabled = true;
      stopButton.disabled = false;

      // watchPosition atualiza a posição enquanto o usuário se movimenta
      watchId = navigator.geolocation.watchPosition(
        updatePosition,
        showPositionError,
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 20000
        }
      );
    }

    // Para o acompanhamento do GPS
    function stopTracking() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      startButton.disabled = false;
      stopButton.disabled = true;
      statusText.textContent = "Acompanhamento pausado";
    }

    // Liga os botões às funções
    startButton.addEventListener("click", startTracking);
    stopButton.addEventListener("click", stopTracking);

    // Registra o arquivo de suporte à instalação e cache básico
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function () {
          statusText.textContent = "GPS pronto • instalação indisponível";
        });
      });
    }
  </script>
</body>
</html>
