
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="GPS Brasil - localização e registro de caminhadas">
<title>GPS Brasil</title>

<link rel="manifest" href="./manifest.json">

<!-- Biblioteca do mapa -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

html,body{
width:100%;
height:100%;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
background:#e9edf1;
color:#243342;
}

#map{
position:absolute;
inset:0;
width:100%;
height:100%;
z-index:1;
background:#e9edf1;
}

.topbar{
position:absolute;
z-index:1000;
top:10px;
left:10px;
right:10px;
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
padding:10px;
border-radius:14px;
background:rgba(255,255,255,.97);
box-shadow:0 2px 12px rgba(0,0,0,.15);
}

.brand{
display:flex;
align-items:center;
gap:9px;
}

.brand-icon{
width:38px;
height:38px;
display:grid;
place-items:center;
border-radius:10px;
background:#2584ed;
color:white;
font-size:25px;
}

.brand strong{
display:block;
font-size:14px;
}

.brand small{
display:block;
margin-top:3px;
color:#71808d;
font-size:9px;
}

#status{
max-width:45%;
color:#5c6b78;
font-size:10px;
line-height:1.3;
text-align:right;
}

.bottom-panel{
position:absolute;
z-index:1000;
left:10px;
right:10px;
bottom:10px;
padding:13px;
border-radius:15px;
background:rgba(255,255,255,.97);
box-shadow:0 2px 15px rgba(0,0,0,.18);
}

.panel-label{
margin-bottom:6px;
color:#7a8792;
font-size:10px;
font-weight:bold;
}

#coordinates{
min-height:18px;
font-size:13px;
font-weight:bold;
}

#accuracy{
margin-top:5px;
color:#71808d;
font-size:11px;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-top:12px;
}

button{
min-height:42px;
padding:0 12px;
border:0;
border-radius:9px;
color:white;
font-size:11px;
font-weight:bold;
cursor:pointer;
}

#startButton{
flex:1;
background:#2584ed;
}

#stopButton{
background:#647482;
}

#clearButton{
background:#d9534f;
}

button:disabled{
opacity:.5;
}

/* Ponto azul de localização */
.gps-marker{
position:relative;
width:44px;
height:44px;
}

.gps-bearing{
position:absolute;
inset:0;
transform:rotate(0deg);
}

.gps-cone{
position:absolute;
left:12px;
top:-2px;
width:20px;
height:29px;
background:rgba(36,125,244,.38);
clip-path:polygon(50% 0,100% 100%,50% 78%,0 100%);
}

.gps-dot{
position:absolute;
left:10px;
top:10px;
width:24px;
height:24px;
border:3px solid white;
border-radius:50%;
background:#3985f4;
box-shadow:0 1px 6px rgba(0,0,0,.4);
}

/* Controles do mapa */
.leaflet-control-zoom{
margin-top:75px!important;
border:0!important;
box-shadow:0 2px 9px rgba(0,0,0,.16)!important;
}

.leaflet-control-zoom a{
color:#34495a!important;
border:0!important;
}

.leaflet-control-attribution{
font-size:9px!important;
}

.map-message{
position:absolute;
z-index:900;
top:50%;
left:50%;
width:85%;
max-width:330px;
padding:14px;
border-radius:12px;
background:white;
color:#455563;
text-align:center;
font-size:13px;
line-height:1.5;
transform:translate(-50%,-50%);
box-shadow:0 2px 12px rgba(0,0,0,.15);
}

@media(max-width:480px){
.topbar{
top:7px;
left:7px;
right:7px;
padding:9px;
}

.bottom-panel{
left:7px;
right:7px;
bottom:7px;
padding:11px;
}

#status{
max-width:42%;
font-size:9px;
}

button{
min-height:40px;
padding:0 9px;
font-size:10px;
}
}
</style>
</head>

<body>

<!-- Área do mapa -->
<div id="map"></div>

<!-- Cabeçalho -->
<header class="topbar">
<div class="brand">
<div class="brand-icon">⌖</div>
<div>
<strong>GPS BRASIL</strong>
<small>MAPA DE RUAS • CAMINHADA</small>
</div>
</div>
<div id="status">Carregando mapa...</div>
</header>

<!-- Painel de localização -->
<section class="bottom-panel">

<div class="panel-label">MINHA LOCALIZAÇÃO</div>

<div id="coordinates">
Aguardando localização...
</div>

<div id="accuracy">
Ative o GPS e permita o acesso à localização.
</div>

<div class="buttons">
<button id="startButton">● INICIAR GPS</button>
<button id="stopButton" disabled>PARAR</button>
<button id="clearButton">LIMPAR CAMINHO</button>
</div>

</section>

<div id="mapMessage" class="map-message">
Carregando mapa...
</div>

<!-- Biblioteca Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ELEMENTOS DA INTERFACE
const statusText=document.getElementById("status");
const coordinatesText=document.getElementById("coordinates");
const accuracyText=document.getElementById("accuracy");
const startButton=document.getElementById("startButton");
const stopButton=document.getElementById("stopButton");
const clearButton=document.getElementById("clearButton");
const mapMessage=document.getElementById("mapMessage");

// CHAVE PARA SALVAR O CAMINHO
const ROUTE_STORAGE_KEY="gpsBrasilCaminhoV2";

// VARIÁVEIS DO APLICATIVO
let map=null;
let userMarker=null;
let accuracyCircle=null;
let routeLine=null;
let watchId=null;
let lastTrailPoint=null;
let firstPosition=true;
let orientationEnabled=false;

// CENTRO INICIAL DO BRASIL
const brasilCenter=[-14.2,-51.9];

// MOSTRAR MENSAGEM
function showMessage(message){
mapMessage.textContent=message;
mapMessage.style.display="block";
}

// ESCONDER MENSAGEM
function hideMessage(){
mapMessage.style.display="none";
}

// INICIALIZAR MAPA
function initializeMap(){

if(typeof L==="undefined"){
statusText.textContent="Erro ao carregar mapa";
showMessage("Não foi possível carregar o mapa. Verifique sua internet.");
return;
}

// CRIA MAPA 2D
map=L.map("map",{
zoomControl:false,
attributionControl:true
}).setView(brasilCenter,4);

// CAMADA OPENSTREETMAP
// Não precisa de chave de API
const osmLayer=L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:'&copy; OpenStreetMap contributors',
subdomains:"abc"
}
);

// ADICIONA MAPA
osmLayer.addTo(map);

// VERIFICA ERRO NO CARREGAMENTO DAS IMAGENS
let tileLoaded=false;

osmLayer.on("tileload",function(){
tileLoaded=true;
hideMessage();
statusText.textContent="Mapa carregado";
});

osmLayer.on("tileerror",function(){
if(!tileLoaded){
showMessage("Não foi possível carregar as ruas. Verifique sua conexão com a internet.");
statusText.textContent="Erro no mapa";
}
});

// CONTROLES DE ZOOM
L.control.zoom({
position:"topright"
}).addTo(map);

// LINHA AZUL DO CAMINHO
routeLine=L.polyline([],{
color:"#287df0",
weight:6,
opacity:.88,
lineCap:"round",
lineJoin:"round"
}).addTo(map);

// RECUPERA CAMINHO ANTERIOR
loadSavedRoute();

// AJUSTA O MAPA PARA CELULAR
setTimeout(function(){
map.invalidateSize();
},500);

statusText.textContent="Mapa carregado";
}

// CRIA ÍCONE AZUL
function createGpsIcon(){

return L.divIcon({
className:"",
html:
'<div class="gps-marker">'+
'<div class="gps-bearing" id="gpsBearing">'+
'<div class="gps-cone"></div>'+
'</div>'+
'<div class="gps-dot"></div>'+
'</div>',
iconSize:[44,44],
iconAnchor:[22,22]
});

}

// SALVA O CAMINHO NO NAVEGADOR
function saveRoute(){

if(!routeLine)return;

const points=routeLine.getLatLngs().map(function(point){
return [point.lat,point.lng];
});

try{
localStorage.setItem(
ROUTE_STORAGE_KEY,
JSON.stringify(points.slice(-3000))
);
}catch(error){
console.log("Erro ao salvar caminho:",error);
}

}

// RECUPERA CAMINHO SALVO
function loadSavedRoute(){

try{

const saved=localStorage.getItem(ROUTE_STORAGE_KEY);

if(saved){

const points=JSON.parse(saved);

if(Array.isArray(points)&&points.length>0){

routeLine.setLatLngs(points);

lastTrailPoint=L.latLng(
points[points.length-1]
);

statusText.textContent="Trajeto anterior recuperado";

}

}

}catch(error){
console.log("Erro ao recuperar caminho:",error);
}

}

// SENSOR DE DIREÇÃO
async function enableOrientation(){

if(orientationEnabled||
!("DeviceOrientationEvent" in window)){
return;
}

try{

if(typeof DeviceOrientationEvent.requestPermission==="function"){

const permission=
await DeviceOrientationEvent.requestPermission();

if(permission!=="granted")return;

}

window.addEventListener(
"deviceorientation",
updateHeading,
true
);

orientationEnabled=true;

}catch(error){
console.log("Bússola indisponível:",error);
}

}

// ATUALIZA CONE DE DIREÇÃO
function updateHeading(event){

let heading=null;

if(typeof event.webkitCompassHeading==="number"){
heading=event.webkitCompassHeading;
}else if(typeof event.alpha==="number"){
heading=360-event.alpha;
}

if(heading!==null&&Number.isFinite(heading)){

const bearing=document.getElementById("gpsBearing");

if(bearing){
bearing.style.transform=
"rotate("+((heading+360)%360)+"deg)";
}

}

}

// REGISTRA PONTO NO CAMINHO
function addRoutePoint(position){

const currentPoint=L.latLng(
position.coords.latitude,
position.coords.longitude
);

// REGISTRA APÓS DESLOCAMENTO SUPERIOR A 3 METROS
if(
lastTrailPoint===null||
lastTrailPoint.distanceTo(currentPoint)>3
){

routeLine.addLatLng(currentPoint);

lastTrailPoint=currentPoint;

saveRoute();

}

}

// RECEBE LOCALIZAÇÃO
function updatePosition(position){

const latitude=position.coords.latitude;
const longitude=position.coords.longitude;
const accuracy=Math.max(1,position.coords.accuracy);

const userPosition=[latitude,longitude];

// MOSTRA COORDENADAS
coordinatesText.textContent=
latitude.toFixed(6)+", "+longitude.toFixed(6);

accuracyText.textContent=
"Precisão aproximada: "+Math.round(accuracy)+" metros";

statusText.textContent="GPS ativo • acompanhando você";

// CRIA OU ATUALIZA PONTO AZUL
if(userMarker===null){

userMarker=L.marker(userPosition,{
icon:createGpsIcon(),
title:"Minha localização",
zIndexOffset:1000
}).addTo(map);

}else{

userMarker.setLatLng(userPosition);

}

// CÍRCULO DE PRECISÃO
if(accuracyCircle===null){

accuracyCircle=L.circle(userPosition,{
radius:accuracy,
color:"#3985f4",
weight:1,
opacity:.4,
fillColor:"#3985f4",
fillOpacity:.16
}).addTo(map);

}else{

accuracyCircle.setLatLng(userPosition);
accuracyCircle.setRadius(accuracy);

}

// REGISTRA CAMINHO
addRoutePoint(position);

// CENTRALIZA NA PRIMEIRA LOCALIZAÇÃO
if(firstPosition){

map.setView(userPosition,17);
firstPosition=false;

}else{

// ACOMPANHA O DESLOCAMENTO
if(!map.getBounds().contains(userPosition)){
map.panTo(userPosition,{animate:true});
}

}

}

// ERROS DE GPS
function gpsError(error){

let message="Não foi possível obter sua localização.";

if(error.code===1){
message="Permita o acesso à localização no Chrome.";
}

if(error.code===2){
message="Sinal GPS indisponível. Tente em local aberto.";
}

if(error.code===3){
message="GPS demorou para responder. Tente novamente.";
}

statusText.textContent="Problema no GPS";
accuracyText.textContent=message;

}

// INICIAR GPS
startButton.addEventListener("click",async function(){

if(!map){
statusText.textContent="Mapa não está pronto";
return;
}

if(!navigator.geolocation){
statusText.textContent="GPS não disponível";
return;
}

if(watchId!==null)return;

await enableOrientation();

statusText.textContent="Procurando sinal GPS...";

accuracyText.textContent=
"Aguarde alguns instantes em local aberto.";

startButton.disabled=true;
stopButton.disabled=false;

// ACOMPANHAMENTO CONTÍNUO
watchId=navigator.geolocation.watchPosition(
updatePosition,
gpsError,
{
enableHighAccuracy:true,
maximumAge:1000,
timeout:30000
}
);

});

// PARAR GPS
stopButton.addEventListener("click",function(){

if(watchId!==null){

navigator.geolocation.clearWatch(watchId);
watchId=null;

}

startButton.disabled=false;
stopButton.disabled=true;

statusText.textContent="GPS pausado";

});

// LIMPAR CAMINHO
clearButton.addEventListener("click",function(){

if(!routeLine)return;

routeLine.setLatLngs([]);

lastTrailPoint=null;

try{
localStorage.removeItem(ROUTE_STORAGE_KEY);
}catch(error){
console.log(error);
}

statusText.textContent="Caminho apagado";

});

// VERIFICA SE A BIBLIOTECA FOI CARREGADA
function startApplication(){

if(typeof L!=="undefined"){
initializeMap();
return;
}

// TENTA CARREGAR POR OUTRO SERVIDOR
const script=document.createElement("script");

script.src=
"https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js";

script.onload=function(){
initializeMap();
};

script.onerror=function(){

statusText.textContent="Falha ao carregar mapa";

showMessage(
"Não foi possível carregar o mapa. Verifique a conexão com a internet."
);

};

document.head.appendChild(script);

}

// SERVICE WORKER
if("serviceWorker" in navigator&&location.protocol==="https:"){

window.addEventListener("load",function(){

navigator.serviceWorker.register("./sw.js")
.catch(function(error){
console.log("Erro no Service Worker:",error);
});

});

}

// INICIA APLICATIVO
startApplication();

</script>

</body>
</html>
