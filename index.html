
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="GPS Brasil - mapa de ruas e localização.">
<title>GPS Brasil</title>

<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

html,body{
width:100%;
height:100%;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
background:#e9edf1;
color:#243342;
}

#map{
position:absolute;
inset:0;
width:100%;
height:100%;
z-index:1;
background:#e9edf1;
}

.topbar{
position:absolute;
z-index:1000;
top:10px;
left:10px;
right:10px;
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
padding:10px;
border-radius:14px;
background:rgba(255,255,255,.97);
box-shadow:0 2px 12px rgba(0,0,0,.15);
}

.brand{
display:flex;
align-items:center;
gap:9px;
}

.brand-icon{
width:38px;
height:38px;
display:grid;
place-items:center;
border-radius:10px;
background:#2584ed;
color:white;
font-size:25px;
}

.brand strong{
display:block;
font-size:14px;
}

.brand small{
display:block;
margin-top:3px;
color:#71808d;
font-size:9px;
}

#status{
max-width:45%;
color:#5c6b78;
font-size:10px;
text-align:right;
}

.bottom-panel{
position:absolute;
z-index:1000;
left:10px;
right:10px;
bottom:10px;
padding:14px;
border-radius:15px;
background:rgba(255,255,255,.97);
box-shadow:0 2px 15px rgba(0,0,0,.18);
}

.panel-label{
margin-bottom:7px;
color:#7a8792;
font-size:10px;
font-weight:bold;
}

#coordinates{
font-size:14px;
font-weight:bold;
}

#accuracy{
margin-top:6px;
color:#71808d;
font-size:12px;
}

.buttons{
display:flex;
gap:9px;
margin-top:13px;
}

button{
min-height:45px;
padding:0 14px;
border:0;
border-radius:10px;
color:white;
font-size:12px;
font-weight:bold;
cursor:pointer;
}

#startButton{
flex:1;
background:#2584ed;
}

#stopButton{
min-width:95px;
background:#647482;
}

button:disabled{
opacity:.5;
}

.gps-marker{
position:relative;
width:44px;
height:44px;
}

.gps-bearing{
position:absolute;
inset:0;
transform:rotate(0deg);
}

.gps-cone{
position:absolute;
left:12px;
top:-2px;
width:20px;
height:29px;
background:rgba(36,125,244,.38);
clip-path:polygon(50% 0,100% 100%,50% 78%,0 100%);
}

.gps-dot{
position:absolute;
left:10px;
top:10px;
width:24px;
height:24px;
border:3px solid white;
border-radius:50%;
background:#3985f4;
box-shadow:0 1px 6px rgba(0,0,0,.4);
}

.leaflet-control-zoom{
margin-top:75px!important;
border:0!important;
box-shadow:0 2px 9px rgba(0,0,0,.16)!important;
}

.leaflet-control-zoom a{
color:#34495a!important;
border:0!important;
}

.leaflet-control-attribution{
font-size:9px!important;
}

.map-message{
position:absolute;
z-index:900;
top:50%;
left:50%;
width:85%;
max-width:330px;
padding:14px;
border-radius:12px;
background:white;
color:#455563;
text-align:center;
font-size:13px;
line-height:1.5;
transform:translate(-50%,-50%);
box-shadow:0 2px 12px rgba(0,0,0,.15);
}

@media(max-width:480px){

.topbar{
top:7px;
left:7px;
right:7px;
padding:9px;
}

.bottom-panel{
left:7px;
right:7px;
bottom:7px;
padding:12px;
}

#status{
max-width:42%;
font-size:9px;
}

button{
min-height:43px;
padding:0 10px;
font-size:11px;
}

}
</style>
</head>

<body>

<!-- MAPA -->
<div id="map"></div>

<!-- CABEÇALHO -->
<header class="topbar">

<div class="brand">
<div class="brand-icon">⌖</div>

<div>
<strong>GPS BRASIL</strong>
<small>MAPA DE RUAS • CAMINHADA</small>
</div>
</div>

<div id="status">Carregando mapa...</div>

</header>

<!-- PAINEL DE LOCALIZAÇÃO -->
<section class="bottom-panel">

<div class="panel-label">MINHA LOCALIZAÇÃO</div>

<div id="coordinates">
Aguardando localização...
</div>

<div id="accuracy">
Toque em iniciar e permita o acesso ao GPS.
</div>

<div class="buttons">

<button id="startButton">
● INICIAR LOCALIZAÇÃO
</button>

<button id="stopButton" disabled>
PARAR
</button>

</div>

</section>

<div id="mapMessage" class="map-message">
Carregando mapa...
</div>

<!-- BIBLIOTECA LEAFLET -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ELEMENTOS DA TELA
const statusText=document.getElementById("status");
const coordinatesText=document.getElementById("coordinates");
const accuracyText=document.getElementById("accuracy");
const startButton=document.getElementById("startButton");
const stopButton=document.getElementById("stopButton");
const mapMessage=document.getElementById("mapMessage");

// CHAVE DO CAMINHO SALVO
const ROUTE_KEY="gpsBrasilCaminhoV3";

// VARIÁVEIS DO MAPA
let map=null;
let userMarker=null;
let accuracyCircle=null;
let routeLine=null;
let watchId=null;

// POSIÇÕES
let lastTrailPoint=null;
let lastStablePosition=null;
let firstPosition=true;
let orientationEnabled=false;

// CENTRO INICIAL DO BRASIL
const brasilCenter=[-14.2,-51.9];

// MOSTRAR MENSAGEM
function showMessage(message){
mapMessage.textContent=message;
mapMessage.style.display="block";
}

// ESCONDER MENSAGEM
function hideMessage(){
mapMessage.style.display="none";
}

// INICIALIZAR MAPA
function initializeMap(){

if(typeof L==="undefined"){
statusText.textContent="Erro ao carregar mapa";
showMessage("Verifique sua conexão com a internet.");
return;
}

// CRIA MAPA 2D
map=L.map("map",{
zoomControl:false
}).setView(brasilCenter,4);

// MAPA OPENSTREETMAP
L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"&copy; OpenStreetMap contributors",
subdomains:"abc"
}
).addTo(map);

// CONTROLES DE ZOOM
L.control.zoom({
position:"topright"
}).addTo(map);

// LINHA AZUL DO CAMINHO
routeLine=L.polyline([],{
color:"#287df0",
weight:6,
opacity:.88,
lineCap:"round",
lineJoin:"round"
}).addTo(map);

// RECUPERAR CAMINHO ANTERIOR
loadSavedRoute();

// AJUSTAR MAPA NO CELULAR
setTimeout(function(){
map.invalidateSize();
},500);

statusText.textContent="Mapa carregado";
hideMessage();

}

// ÍCONE DO PONTO AZUL
function createGpsIcon(){

return L.divIcon({
className:"",
html:
'<div class="gps-marker">'+
'<div class="gps-bearing" id="gpsBearing">'+
'<div class="gps-cone"></div>'+
'</div>'+
'<div class="gps-dot"></div>'+
'</div>',
iconSize:[44,44],
iconAnchor:[22,22]
});

}

// SALVAR CAMINHO
function saveRoute(){

if(!routeLine)return;

const points=routeLine.getLatLngs().map(function(point){
return [point.lat,point.lng];
});

try{

localStorage.setItem(
ROUTE_KEY,
JSON.stringify(points.slice(-3000))
);

}catch(error){

console.log("Erro ao salvar caminho:",error);

}

}

// RECUPERAR CAMINHO
function loadSavedRoute(){

try{

const saved=localStorage.getItem(ROUTE_KEY);

if(saved){

const points=JSON.parse(saved);

if(Array.isArray(points)&&points.length>0){

routeLine.setLatLngs(points);

lastTrailPoint=L.latLng(
points[points.length-1]
);

}

}

}catch(error){

console.log("Erro ao recuperar caminho:",error);

}

}

// ATIVAR BÚSSOLA
async function enableOrientation(){

if(
orientationEnabled||
!("DeviceOrientationEvent" in window)
){
return;
}

try{

if(typeof DeviceOrientationEvent.requestPermission==="function"){

const permission=
await DeviceOrientationEvent.requestPermission();

if(permission!=="granted")return;

}

window.addEventListener(
"deviceorientation",
updateHeading,
true
);

orientationEnabled=true;

}catch(error){

console.log("Bússola indisponível:",error);

}

}

// ATUALIZAR DIREÇÃO
function updateHeading(event){

let heading=null;

if(typeof event.webkitCompassHeading==="number"){

heading=event.webkitCompassHeading;

}else if(typeof event.alpha==="number"){

heading=360-event.alpha;

}

if(heading!==null&&Number.isFinite(heading)){

const bearing=document.getElementById("gpsBearing");

if(bearing){

bearing.style.transform=
"rotate("+((heading+360)%360)+"deg)";

}

}

}

// REGISTRAR CAMINHO
function addRoutePoint(position){

const currentPoint=L.latLng(
position.coords.latitude,
position.coords.longitude
);

// IGNORAR MOVIMENTOS MENORES QUE 3 METROS
if(
lastTrailPoint===null||
lastTrailPoint.distanceTo(currentPoint)>3
){

routeLine.addLatLng(currentPoint);

lastTrailPoint=currentPoint;

saveRoute();

}

}

// ATUALIZAR POSIÇÃO COM FILTRO DE ESTABILIDADE
function updatePosition(position){

const latitude=position.coords.latitude;
const longitude=position.coords.longitude;
const accuracy=position.coords.accuracy;

const newPosition=L.latLng(latitude,longitude);

// MOSTRAR COORDENADAS RECEBIDAS
coordinatesText.textContent=
latitude.toFixed(6)+", "+longitude.toFixed(6);

// MOSTRAR PRECISÃO
accuracyText.textContent=
"Precisão estimada: "+Math.round(accuracy)+" metros";

// IGNORAR POSIÇÕES COM PRECISÃO MUITO RUIM
if(accuracy>40){

statusText.textContent="Aguardando sinal GPS melhor";
return;

}

// PRIMEIRA POSIÇÃO
if(lastStablePosition===null){

lastStablePosition=newPosition;

}else{

// DISTÂNCIA DA ÚLTIMA POSIÇÃO ACEITA
const distance=
lastStablePosition.distanceTo(newPosition);

// LIMITE PARA IGNORAR OSCILAÇÕES
const minimumMovement=
Math.max(5,Math.min(accuracy*0.7,12));

// IGNORAR PEQUENAS OSCILAÇÕES
if(distance<minimumMovement){

statusText.textContent=
"GPS ativo • posição estabilizada";

return;

}

// ACEITAR NOVA POSIÇÃO
lastStablePosition=newPosition;

}

// POSIÇÃO ESTÁVEL
const userPosition=[
lastStablePosition.lat,
lastStablePosition.lng
];

statusText.textContent=
"GPS ativo • acompanhando você";

// CRIAR OU ATUALIZAR PONTO AZUL
if(userMarker===null){

userMarker=L.marker(userPosition,{
icon:createGpsIcon(),
title:"Minha localização",
zIndexOffset:1000
}).addTo(map);

}else{

userMarker.setLatLng(userPosition);

}

// CÍRCULO DE PRECISÃO
if(accuracyCircle===null){

accuracyCircle=L.circle(userPosition,{
radius:accuracy,
color:"#3985f4",
weight:1,
opacity:.4,
fillColor:"#3985f4",
fillOpacity:.16
}).addTo(map);

}else{

accuracyCircle.setLatLng(userPosition);
accuracyCircle.setRadius(accuracy);

}

// REGISTRAR CAMINHO
addRoutePoint({
coords:{
latitude:lastStablePosition.lat,
longitude:lastStablePosition.lng
}
});

// CENTRALIZAR PRIMEIRA POSIÇÃO
if(firstPosition){

map.setView(userPosition,18);
firstPosition=false;

}else{

// ACOMPANHAR QUANDO SAIR DA ÁREA VISÍVEL
if(!map.getBounds().contains(userPosition)){

map.panTo(userPosition,{
animate:true
});

}

}

}

// TRATAR ERROS DO GPS
function gpsError(error){

let message="Não foi possível obter sua localização.";

if(error.code===1){

message="Permita a localização precisa nas configurações do Chrome.";

}

if(error.code===2){

message="Sinal GPS indisponível. Vá para um local aberto.";

}

if(error.code===3){

message="GPS demorou para responder. Tente novamente.";

}

statusText.textContent="Problema na localização";
accuracyText.textContent=message;

startButton.disabled=false;
stopButton.disabled=true;
watchId=null;

}

// INICIAR LOCALIZAÇÃO
startButton.addEventListener("click",async function(){

if(!map){

statusText.textContent="Mapa não está pronto";
return;

}

if(!navigator.geolocation){

statusText.textContent="GPS não disponível";
return;

}

if(watchId!==null)return;

// ATIVAR BÚSSOLA
await enableOrientation();

// STATUS
statusText.textContent="Buscando GPS...";

accuracyText.textContent=
"Aguarde o sinal do satélite.";

// REINICIAR FILTRO PARA NOVA SESSÃO
lastStablePosition=null;
firstPosition=true;

// BOTÕES
startButton.disabled=true;
stopButton.disabled=false;

// ACOMPANHAMENTO CONTÍNUO
watchId=navigator.geolocation.watchPosition(
updatePosition,
gpsError,
{
enableHighAccuracy:true,
maximumAge:0,
timeout:30000
}
);

});

// PARAR LOCALIZAÇÃO
stopButton.addEventListener("click",function(){

if(watchId!==null){

navigator.geolocation.clearWatch(watchId);
watchId=null;

}

startButton.disabled=false;
stopButton.disabled=true;

statusText.textContent="Localização pausada";

});

// INICIAR APLICAÇÃO
function startApplication(){

if(typeof L!=="undefined"){

initializeMap();
return;

}

// TENTAR OUTRO SERVIDOR DA BIBLIOTECA
const script=document.createElement("script");

script.src=
"https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js";

script.onload=function(){

initializeMap();

};

script.onerror=function(){

statusText.textContent="Erro ao carregar mapa";

showMessage(
"Não foi possível carregar o mapa. Verifique sua internet."
);

};

document.head.appendChild(script);

}

// SERVICE WORKER
if(
"serviceWorker" in navigator&&
location.protocol==="https:"
){

window.addEventListener("load",function(){

navigator.serviceWorker.register("./sw.js")
.catch(function(error){

console.log("Erro no Service Worker:",error);

});

});

}

// INICIAR GPS BRASIL
startApplication();

</script>

</body>
</html>
