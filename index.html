
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102536">
<title>GPS Brasil</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* {
box-sizing: border-box;
}

html, body {
margin: 0;
width: 100%;
height: 100%;
font-family: Arial, sans-serif;
overflow: hidden;
background: #eef2f4;
}

#map {
position: absolute;
inset: 0;
z-index: 1;
}

.topbar {
position: absolute;
top: 12px;
left: 12px;
right: 12px;
z-index: 1000;
background: white;
padding: 14px;
border-radius: 14px;
box-shadow: 0 3px 15px #0002;
display: flex;
justify-content: space-between;
align-items: center;
}

.logo {
font-size: 17px;
font-weight: bold;
color: #0879d1;
}

.subtitle {
font-size: 10px;
color: #777;
margin-top: 4px;
}

#status {
font-size: 11px;
color: #526977;
text-align: right;
max-width: 45%;
}

.panel {
position: absolute;
z-index: 1000;
bottom: 12px;
left: 12px;
right: 12px;
background: white;
padding: 16px;
border-radius: 16px;
box-shadow: 0 3px 18px #0003;
}

.label {
font-size: 10px;
color: #718492;
font-weight: bold;
margin-bottom: 8px;
}

#coordinates {
font-size: 14px;
font-weight: bold;
color: #172b3a;
}

#accuracy {
font-size: 11px;
color: #718492;
margin-top: 6px;
}

.buttons {
display: flex;
gap: 10px;
margin-top: 14px;
}

button {
border: none;
padding: 14px;
border-radius: 10px;
font-size: 13px;
font-weight: bold;
color: white;
cursor: pointer;
}

#start {
flex: 1;
background: #0879d1;
}

#stop {
background: #526977;
}

button:disabled {
opacity: .5;
}

.gps-dot {
width: 20px;
height: 20px;
background: #1688f8;
border: 4px solid white;
border-radius: 50%;
box-shadow: 0 0 0 7px #1688f833,
0 2px 7px #0007;
}

.leaflet-control-zoom a {
color: #0879d1 !important;
}

@media(max-width:480px) {
.topbar {
top: 9px;
left: 9px;
right: 9px;
}

.panel {
left: 9px;
right: 9px;
bottom: 9px;
}
}
</style>
</head>

<body>

<!-- MAPA 2D VISTO DE CIMA -->
<div id="map"></div>

<!-- CABEÇALHO -->
<div class="topbar">
<div>
<div class="logo">⌖ GPS BRASIL</div>
<div class="subtitle">MAPA DE RUAS • CAMINHADA</div>
</div>
<div id="status">Aguardando GPS</div>
</div>

<!-- PAINEL DE LOCALIZAÇÃO -->
<div class="panel">

<div class="label">MINHA LOCALIZAÇÃO</div>

<div id="coordinates">
Toque em iniciar localização
</div>

<div id="accuracy">
Sua posição aparecerá no mapa.
</div>

<div class="buttons">
<button id="start">● INICIAR LOCALIZAÇÃO</button>
<button id="stop" disabled>PARAR</button>
</div>

</div>

<!-- BIBLIOTECA DO MAPA -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ELEMENTOS DA TELA
const statusText = document.getElementById("status");
const coordinates = document.getElementById("coordinates");
const accuracy = document.getElementById("accuracy");
const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");

// CENTRO INICIAL DO BRASIL
const map = L.map("map", {
zoomControl: false
}).setView([-14.2, -51.9], 4);

// MAPA DE RUAS OPENSTREETMAP
// VISUALIZAÇÃO PLANA, SEM 3D
L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom: 19,
attribution: '&copy; OpenStreetMap'
}
).addTo(map);

// CONTROLE DE ZOOM
L.control.zoom({
position: "topright"
}).addTo(map);

// MARCADOR AZUL DE LOCALIZAÇÃO
const gpsIcon = L.divIcon({
className: "",
html: '<div class="gps-dot"></div>',
iconSize: [20,20],
iconAnchor: [10,10]
});

let marker = null;
let circle = null;
let watchId = null;

// RECEBE A POSIÇÃO DO GPS
function updatePosition(position) {

const lat = position.coords.latitude;
const lon = position.coords.longitude;
const precision = Math.round(position.coords.accuracy);

const positionGPS = [lat, lon];

// MOSTRA AS COORDENADAS
coordinates.textContent =
lat.toFixed(6) + ", " + lon.toFixed(6);

accuracy.textContent =
"Precisão aproximada: " + precision + " metros";

statusText.textContent = "GPS ATIVO";

// CRIA OU ATUALIZA O PONTO AZUL
if (marker === null) {

marker = L.marker(positionGPS, {
icon: gpsIcon
}).addTo(map);

} else {

marker.setLatLng(positionGPS);

}

// MOSTRA A PRECISÃO DO GPS
if (circle === null) {

circle = L.circle(positionGPS, {
radius: precision,
color: "#1688f8",
weight: 1,
fillColor: "#1688f8",
fillOpacity: 0.12
}).addTo(map);

} else {

circle.setLatLng(positionGPS);
circle.setRadius(precision);

}

// CENTRALIZA O MAPA NA PESSOA
map.setView(positionGPS, 17);

}

// TRATA ERROS DO GPS
function gpsError(error) {

if (error.code === 1) {
statusText.textContent = "Permita a localização";
}

else if (error.code === 2) {
statusText.textContent = "Sinal GPS indisponível";
}

else if (error.code === 3) {
statusText.textContent = "Tempo esgotado";
}

else {
statusText.textContent = "Erro no GPS";
}

}

// INICIA O GPS
function startGPS() {

if (!navigator.geolocation) {

statusText.textContent = "GPS não suportado";
return;

}

if (watchId !== null) {
navigator.geolocation.clearWatch(watchId);
}

statusText.textContent = "Procurando localização...";
coordinates.textContent = "Aguardando sinal GPS...";

startButton.disabled = true;
stopButton.disabled = false;

// ACOMPANHAMENTO CONTÍNUO
watchId = navigator.geolocation.watchPosition(
updatePosition,
gpsError,
{
enableHighAccuracy: true,
maximumAge: 1000,
timeout: 20000
}
);

}

// PARA O GPS
function stopGPS() {

if (watchId !== null) {

navigator.geolocation.clearWatch(watchId);
watchId = null;

}

statusText.textContent = "GPS pausado";

startButton.disabled = false;
stopButton.disabled = true;

}

// BOTÕES
startButton.addEventListener("click", startGPS);
stopButton.addEventListener("click", stopGPS);

</script>

</body>
</html>
